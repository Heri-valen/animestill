<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>OtakuTees.store - Camisas y Sacos Personalizados</title>
		<meta
			name="description"
			content="Tienda online de camisas y sacos personalizados con estampados de anime"
		/>

		<!-- Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							'otaku-dark': '#1a1a2e',
							'otaku-purple': '#16213e',
							'otaku-pink': '#ba5258',
							'otaku-cyan': '#4ecdc4',
							'otaku-blue': '#45b7d1',
							'otaku-green': '#96ceb4'
						}
					}
				}
			};
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-gray-50">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
